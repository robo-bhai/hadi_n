name: Binance Market Scanner Bot

on:
  workflow_dispatch:

# Consecutive duplicate runs ko rokne ke liye:
concurrency:
  group: scanner-group
  cancel-in-progress: true

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy mysql-connector-python pillow

      - name: Run Market Scanner Script
        env:
          EX_TRADE: ${{ secrets.EX_TRADE }}
          PASS_DB_2: ${{ secrets.PASS_DB_2 }}
          NTFY_FOR_SCANNER: ${{ secrets.NTFY_FOR_SCANNER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_TRADER_ENGINE }}
          NTFY_TOPIC_TRADER_ENGINE: ${{ secrets.NTFY_TOPIC_TRADER_ENGINE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ -f "legendary_scanner.py" ]; then
            python legendary_scanner.py
          elif [ -f "scanner.py" ]; then
            python scanner.py
          else
            echo "❌ Error: Neither legendary_scanner.py nor scanner.py found!"
            exit 1
          fi
