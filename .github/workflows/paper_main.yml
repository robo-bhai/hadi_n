name: Manual Paper Trade Monitor & Pushbullet Report

on:
  workflow_dispatch:
  # Agar aap chahein ke ye har 5 ya 10 minute baad auto-run ho, to neeche wali lines uncomment kar lein:
  # schedule:
  #   - cron: '*/10 * * * *'

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas mysql-connector-python

      - name: Run Paper Trade Monitor & Send Ntfy Alert
        env:
          # Database Host & Port matching sqlsetup script
          MYSQL_HOST: "mysql-3a3d5779-project-b71a.b.aivencloud.com"
          MYSQL_USER: "avnadmin"
          MYSQL_DB: "defaultdb"
          MYSQL_PORT: "23464"
          
          # Secrets from GitHub
          PASS_DB_2: ${{ secrets.PASS_DB_2 }}
          LIVE_MON_PAPER: ${{ secrets.LIVE_MON_PAPER }}
          LIVE_MON_TOP: ${{ secrets.LIVE_MON_TOP }}
        run: python trade_monitor_paper.py
