name: Manual Paper Trade Monitor & Pushbullet Report

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas mysql-connector-python

      - name: Run Paper Trade Monitor & Send Ntfy Alert
        env:
          # MySQL Database Connection Details
          MYSQL_HOST: "mysql-paper-trading-nomistorage3-d0bf.d.aivencloud.com"
          MYSQL_USER: "avnadmin"
          MYSQL_DB: "defaultdb"
          MYSQL_PORT: "13722"
          
          # Secrets fetched from GitHub Secrets
          PASS_DB_2: ${{ secrets.PASS_DB_2 }}
          LIVE_MON_PAPER: ${{ secrets.LIVE_MON_PAPER }}
        run: python trade_monitor.py
