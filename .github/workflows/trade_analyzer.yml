name: Crypto Trade A-to-Z Analyzer

on:
  # 1. Automatic Scheduled Run (Every 6 hours)
  schedule:
    - cron: '0 */6 * * *'

  # 2. Manual Trigger Button from GitHub UI
  workflow_dispatch:

jobs:
  analyze-trades:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.10 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Install required Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests mysql-connector-python

      # Step 4: Run the Trade Analyzer Script with Secrets
      - name: Run Trade Analyzer Script
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python trade_analyzer.py

