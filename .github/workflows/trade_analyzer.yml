name: Crypto Trade A-to-Z Analyzer

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:       # Manual trigger button in GitHub UI

jobs:
  analyze-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests mysql-connector-python openpyxl

      - name: Run Trade Analyzer & Generate Excel
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python trade_analyzer.py

      - name: Upload Excel Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-trade-report
          path: Crypto_Trade_Report.xlsx
          retention-days: 7
