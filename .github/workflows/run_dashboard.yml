name: Live Crypto Dashboard Server

on:
  workflow_dispatch:

concurrency:
  group: crypto-dashboard-server
  cancel-in-progress: false

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask mysql-connector-python pandas requests Flask-HTTPAuth werkzeug
          
          # Install Cloudflared CLI
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Launch Server via Flask CLI
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          echo "Checking Repository Root Files..."
          ls -la

          echo "Launching Flask App on 0.0.0.0:5000..."
          FLASK_APP=server.py nohup flask run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &

          echo "Waiting 10 seconds for Flask to register..."
          sleep 10

          echo "================ FLASK LOGS ================"
          cat flask.log
          echo "============================================"

      - name: Launch Permanent Cloudflare Tunnel & Send Static Link
        run: |
          echo "Starting Cloudflare Tunnel via Token..."
          nohup cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TOKEN_1 }} > cloudflare.log 2>&1 &
          sleep 5

          STATIC_URL="https://crypto.hadi88.online"

          # Send Alert to ntfy.sh
          curl -s -X POST https://ntfy.sh/lev_nasiiar_link_988 \
            -H "Title: 🚀 Live Trading Dashboard Active" \
            -H "Click: $STATIC_URL" \
            -H "Priority: high" \
            -H "Tags: rocket,link" \
            -d "Your permanent dashboard is live: $STATIC_URL"

          echo "✅ Server successfully live at static address: $STATIC_URL"

      - name: Keep Server Running for 3 Hours
        run: |
          echo "⏳ Server is running via Cloudflare. Will stay active for 3 hours..."
          sleep 10800
          echo "🛑 3 hours completed. Shutting down server."
