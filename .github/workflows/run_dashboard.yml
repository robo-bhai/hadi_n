name: Live Crypto Dashboard Server

on:
  workflow_dispatch:

concurrency:
  group: crypto-dashboard-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask mysql-connector-python pandas requests gunicorn
          
          # Install Cloudflared CLI
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Production Server via Gunicorn (Background)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          echo "Starting Gunicorn WSGI Server in background..."
          nohup gunicorn -w 2 -b 0.0.0.0:5000 server:app > flask.log 2>&1 &
          echo "Waiting 5 seconds for server boot..."
          sleep 5
          cat flask.log

      - name: Create Cloudflare Tunnel & Send Link to ntfy
        run: |
          echo "Generating Public URL via Cloudflare Tunnel..."
          
          # Start Cloudflare Tunnel detaching process
          nohup cloudflared tunnel --url http://localhost:5000 > cloudflare.log 2>&1 &
          sleep 10

          # Extract trycloudflare.com URL from log file
          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflare.log | head -n 1)
          echo "Public Server URL: $TUNNEL_URL"

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to generate Cloudflare Tunnel URL"
            cat cloudflare.log
            exit 1
          fi

          # Send Dashboard Link via ntfy.sh
          curl -s -X POST https://ntfy.sh/lev_nasiiar_link_988 \
            -H "Title: 🚀 Live Crypto Dashboard Link (Cloudflare)" \
            -H "Click: $TUNNEL_URL" \
            -H "Priority: high" \
            -H "Tags: rocket,link" \
            -d "Your live trading dashboard is active: $TUNNEL_URL"

          echo "✅ ntfy alert sent successfully!"

      - name: Keep Server Running for 3 Hours
        run: |
          echo "⏳ Server is running via Cloudflare. Will stay active for 3 hours..."
          sleep 10800
          echo "🛑 3 hours completed. Shutting down server."
