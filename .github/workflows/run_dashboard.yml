name: Live Crypto Dashboard Server

on:
  workflow_dispatch:

# cancel-in-progress false kar diya hai taakay naya server pehle poora ready ho sakay
concurrency:
  group: crypto-dashboard-server
  cancel-in-progress: false

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask mysql-connector-python pandas requests gunicorn Flask-HTTPAuth werkzeug Pillow
          
          # Install Cloudflared CLI
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Production Server via Gunicorn (Background)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          echo "Starting Gunicorn WSGI Server in background..."
          nohup gunicorn -w 2 -b 0.0.0.0:5000 server:app > flask.log 2>&1 &
          echo "Waiting 5 seconds for server boot..."
          sleep 5
          cat flask.log

      - name: Launch Permanent Cloudflare Tunnel & Send Static Link
        env:
          TUNNEL_CREDS: ${{ secrets.CLOUDFLARE_CREDENTIALS }}
          TUNNEL_UUID: "d7f50d0e-21c6-4eb0-b2c6-d8c33b963639"
        run: |
          echo "Setting up Cloudflare Credentials & Config..."
          mkdir -p ~/.cloudflared
          echo "$TUNNEL_CREDS" > ~/.cloudflared/$TUNNEL_UUID.json

          # Generate Cloudflare Config File
          cat <<EOF > ~/.cloudflared/config.yml
          tunnel: $TUNNEL_UUID
          credentials-file: /home/runner/.cloudflared/$TUNNEL_UUID.json
          ingress:
            - hostname: hadi88.online
              service: http://localhost:5000
            - service: http_status:404
          EOF

          # Connect Tunnel (Cloudflare automatically routes traffic to this new active connection)
          nohup cloudflared tunnel run my-dashboard > cloudflare.log 2>&1 &
          sleep 5

          STATIC_URL="https://hadi88.online"

          # Send Alert to ntfy.sh
          curl -s -X POST https://ntfy.sh/lev_nasiiar_link_988 \
            -H "Title: 🚀 Live Trading Dashboard Active" \
            -H "Click: $STATIC_URL" \
            -H "Priority: high" \
            -H "Tags: rocket,link" \
            -d "Your permanent dashboard is live: $STATIC_URL"

          echo "✅ Server successfully live at static address: $STATIC_URL"

      - name: Keep Server Running for 3 Hours
        run: |
          echo "⏳ Server is running via Cloudflare. Will stay active for 3 hours..."
          sleep 10800
          echo "🛑 3 hours completed. Shutting down server."
