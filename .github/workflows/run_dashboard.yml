name: Live Crypto Dashboard Server

on:
  workflow_dispatch: # Allows manually starting the workflow from GitHub Actions tab

# Automatically cancels any currently running instance of this workflow
concurrency:
  group: crypto-dashboard-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 190 # Safety limit slightly above 3 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask mysql-connector-python pandas requests matplotlib
          npm install -g localtunnel

      - name: Launch Flask Server in Background
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          python server.py &
          echo "Waiting 5 seconds for Flask server to boot up..."
          sleep 5

      - name: Create Tunnel & Send Link to Pushbullet
        env:
          PUSHBULLET_TOKEN: ${{ secrets.PUSHBULLET_TOKEN }}
        run: |
          echo "Generating Public URL via Localtunnel..."
          # Start localtunnel in background and save logs to url.txt
          lt --port 5000 > tunnel.log 2>&1 &
          sleep 5

          # Extract URL from log file
          TUNNEL_URL=$(grep -o 'https://[^ ]*' tunnel.log | head -n 1)
          echo "Public Server URL: $TUNNEL_URL"

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to generate Tunnel URL"
            cat tunnel.log
            exit 1
          fi

          # Send Notification to Pushbullet
          curl -s -X POST https://api.pushbullet.com/v2/pushes \
            -H "Access-Token: $PUSHBULLET_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "{\"type\": \"note\", \"title\": \"🚀 Live Crypto Dashboard Link\", \"body\": \"Your live trading dashboard is active for 3 hours:\n\n$TUNNEL_URL\"}"
          
          echo "✅ Pushbullet alert sent successfully!"

      - name: Keep Server Running for 3 Hours
        run: |
          echo "⏳ Server is running. Will stay active for 3 hours (10,800 seconds)..."
          sleep 10800
          echo "🛑 3 hours completed. Shutting down server."
