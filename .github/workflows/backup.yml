name: Database Backup to Google Drive (Keep Latest 1 Only)

on:
  workflow_dispatch: # Sirf Manual Trigger active hai

jobs:
  backup-to-gdrive:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pymysql sqlalchemy python-dotenv jq

    - name: Run Encrypted Backup
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
        BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
      run: |
        echo "🔒 Starting Database Backup..."
        python db_backup_manager.py backup
        
        # Verify file creation
        if [ -z "$(ls -A *.enc 2>/dev/null)" ]; then
          echo "❌ Backup file not generated!"
          exit 1
        fi
        echo "✅ Encrypted backup generated successfully."

    - name: Install & Setup Rclone
      env:
        RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone jq
        mkdir -p ~/.config/rclone
        
        # Write config via environment variable safely
        echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
        
        # Verify Rclone configuration
        echo "📋 Available Rclone Remotes:"
        rclone listremotes

    - name: Upload New Backup & Keep Only Latest 1 (Permanent Delete)
      run: |
        TARGET_DIR="gdrive:DB_Backups"

        echo "🚀 Uploading new backup to Google Drive folder: DB_Backups..."
        rclone copy *.enc $TARGET_DIR --verbose

        echo "🧹 Checking and rotating backups (Keeping ONLY 1 latest file)..."
        
        # Google Drive se sabhi .enc files ki sorted list (Oldest to Newest)
        ALL_FILES=$(rclone lsjson $TARGET_DIR --include "*.enc" | jq -r 'sort_by(.ModTime) | .[].Name' | grep -v '^$' || true)
        
        if [ -z "$ALL_FILES" ]; then
          FILE_COUNT=0
        else
          FILE_COUNT=$(echo "$ALL_FILES" | wc -l)
        fi

        echo "📊 Total backups currently in Drive: $FILE_COUNT"

        # Agar 1 se zyada files hain to purani sabhi delete karna
        if [ "$FILE_COUNT" -gt 1 ]; then
          DELETE_COUNT=$((FILE_COUNT - 1))
          echo "⚠️ Found $FILE_COUNT backups. Permanently deleting $DELETE_COUNT old backup(s)..."
          
          FILES_TO_DELETE=$(echo "$ALL_FILES" | head -n $DELETE_COUNT)
          
          for FILE in $FILES_TO_DELETE; do
            echo "🗑️ Permanently deleting old backup: $FILE"
            # --drive-use-trash=false Trash/Recycle Bin ko bypass karta he
            rclone deletefile "$TARGET_DIR/$FILE" --drive-use-trash=false
          done
          echo "✅ Old backups cleaned up permanently."
        else
          echo "ℹ️ Only $FILE_COUNT backup present. No cleanup needed."
        fi

        # Google Drive Trash / Recycle Bin ko mukammal khali karna
        echo "🧹 Emptying Google Drive Trash..."
        rclone cleanup $TARGET_DIR

    - name: Workflow Status Summary
      run: |
        echo "🎉 Backup completed and only 1 latest file is retained in Drive!"
