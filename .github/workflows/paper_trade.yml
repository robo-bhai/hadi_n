name: Paper Trade Monitor & Pushbullet Report

on:
  workflow_dispatch: # Sirf GitHub UI se manually run karne ke liye

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas mysql-connector-python reportlab matplotlib

      - name: Run Paper Trade Script
        env:
          PASS_DB_2: ${{ secrets.PASS_DB_2 }}
          PUSHBULLET_TOKEN: ${{ secrets.PUSHBULLET_TOKEN }}
          LIVE_MON_PAPER: ${{ secrets.LIVE_MON_PAPER }}  
        run: python paper_trade.py
