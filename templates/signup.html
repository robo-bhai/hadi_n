{% extends "base.html" %}
{% block title %}Sign Up - MYSQL{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl mt-12">
    <div class="text-center mb-8">
        <h2 class="text-2xl font-black text-white">Create Account</h2>
        <p class="text-sm text-slate-400 mt-1">Join MYSQL platform and setup your ntfy alerts.</p>
    </div>

    {% if error %}
    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm p-3 rounded-xl mb-4 text-center">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
            <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">NTFY Topic (Optional)</label>
            <input type="text" name="ntfy_topic" placeholder="e.g. my_custom_topic_88" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition font-mono text-sm">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 mt-2">
            Register Account
        </button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">
        Already have an account? <a href="/login" class="text-blue-400 font-medium hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
