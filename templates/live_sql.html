<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Crypto Analyst Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        .dashboard-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 1px solid #334155;
            padding: 15px 0;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .badge-long { background-color: #16a34a; color: #fff; font-weight: bold; }
        .badge-short { background-color: #dc2626; color: #fff; font-weight: bold; }
        .metric-title { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 1.05rem; font-weight: 700; color: #f8fafc; word-break: break-all; }
        .pnl-positive { color: #22c55e !important; }
        .pnl-negative { color: #ef4444 !important; }
        
        /* Ultra Big Chart Container */
        .big-chart-container {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
        }
        .chart-img {
            border-radius: 8px;
            width: 100%;
            max-height: 580px;
            object-fit: contain;
        }
        
        /* 2x2 Card Grid Box */
        .metric-card-2x2 {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            height: 100%;
        }

        /* Dropdown Styling */
        .coin-select {
            background-color: #0f172a;
            color: #38bdf8;
            border: 1px solid #0284c7;
            font-weight: 700;
            border-radius: 8px;
            padding: 6px 12px;
        }
        .coin-select:focus {
            background-color: #0f172a;
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        @media (max-width: 576px) {
            .dashboard-header h3 { font-size: 1.2rem; }
            .metric-title { font-size: 0.65rem; }
            .metric-value { font-size: 0.95rem; }
            .chart-img { max-height: 380px; }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="dashboard-header mb-3 mb-md-4">
        <div class="container-fluid px-3 px-md-4">
            <div class="row align-items-center text-center text-md-start">
                <div class="col-12 col-md-6 mb-2 mb-md-0">
                    <h3 class="fw-bold text-white m-0"><i class="fa-solid fa-chart-line me-2 text-primary"></i>INSTITUTIONAL QUANT</h3>
                    <small class="text-muted d-block mt-1">Live MySQL Stream & Technical Analysis Engine</small>
                </div>
                <div class="col-12 col-md-6 text-md-end">
                    <button onclick="loadDashboard()" class="btn btn-outline-primary btn-sm px-3 me-2"><i class="fa-solid fa-rotate me-1"></i> Refresh</button>
                    <span id="last-updated" class="d-block d-sm-inline mt-2 mt-sm-0 text-muted small">Updated: Just now</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid px-3 px-md-4">
        <!-- Portfolio Overview Cards -->
        <div class="row g-2 g-md-3 mb-4">
            <div class="col-12 col-sm-4">
                <div class="card-custom p-3">
                    <div class="metric-title"><i class="fa-solid fa-wallet me-1"></i> Total Portfolio Equity</div>
                    <div class="metric-value text-info mt-1" id="port-total">$0.00 USDT</div>
                </div>
            </div>
            <div class="col-6 col-sm-4">
                <div class="card-custom p-3">
                    <div class="metric-title"><i class="fa-solid fa-vault me-1"></i> Available Margin</div>
                    <div class="metric-value text-success mt-1" id="port-avail">$0.00 USDT</div>
                </div>
            </div>
            <div class="col-6 col-sm-4">
                <div class="card-custom p-3">
                    <div class="metric-title"><i class="fa-solid fa-lock me-1"></i> Frozen Margin</div>
                    <div class="metric-value text-warning mt-1" id="port-frozen">$0.00 USDT</div>
                </div>
            </div>
        </div>

        <!-- Coin Selector Dropdown Section -->
        <div class="card-custom p-3 mb-4">
            <div class="row align-items-center g-2">
                <div class="col-12 col-md-5">
                    <label class="form-label fw-bold text-white mb-0 me-2"><i class="fa-solid fa-coins me-2 text-warning"></i>Select Active Position:</label>
                </div>
                <div class="col-12 col-md-7">
                    <select id="coinDropdown" class="form-select coin-select" onchange="renderSelectedCoin()">
                        <option value="">Loading Active Coins...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Single Coin Focus View Container -->
        <div id="trades-container" class="mb-5">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 small">Fetching Active Trades & Rendering Technical Charts...</p>
            </div>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        let globalTradesData = [];
        let currentSelectedSymbol = "";

        async function loadDashboard() {
            try {
                const response = await fetch('/api/active_trades');
                const data = await response.json();

                if (data.status === 'success') {
                    // Update Portfolio Metrics
                    if (data.portfolio) {
                        document.getElementById('port-total').innerText = `$${parseFloat(data.portfolio.total_capital).toFixed(2)} USDT`;
                        document.getElementById('port-avail').innerText = `$${parseFloat(data.portfolio.available_capital).toFixed(2)} USDT`;
                        document.getElementById('port-frozen').innerText = `$${parseFloat(data.portfolio.frozen_margin).toFixed(2)} USDT`;
                    }

                    globalTradesData = data.trades || [];
                    populateDropdown();
                    renderSelectedCoin();

                    document.getElementById('last-updated').innerText = `Updated: ${new Date().toLocaleTimeString()}`;
                }
            } catch (err) {
                console.error("Dashboard Fetch Error:", err);
            }
        }

        function populateDropdown() {
            const dropdown = document.getElementById('coinDropdown');
            dropdown.innerHTML = '';

            if (globalTradesData.length === 0) {
                dropdown.innerHTML = '<option value="">No Active Trades Found in DB</option>';
                return;
            }

            globalTradesData.forEach((item, idx) => {
                const t = item.trade_info;
                const opt = document.createElement('option');
                opt.value = t.symbol;
                opt.innerText = `${t.symbol} (${t.direction} ${t.leverage}x) — PnL: ${item.pnl_usdt >= 0 ? '+' : ''}${item.pnl_usdt} USDT`;
                dropdown.appendChild(opt);
            });

            // Retain selected symbol across auto-refreshes
            if (currentSelectedSymbol && globalTradesData.some(item => item.trade_info.symbol === currentSelectedSymbol)) {
                dropdown.value = currentSelectedSymbol;
            } else {
                currentSelectedSymbol = globalTradesData[0].trade_info.symbol;
                dropdown.value = currentSelectedSymbol;
            }
        }

        function renderSelectedCoin() {
            const dropdown = document.getElementById('coinDropdown');
            currentSelectedSymbol = dropdown.value;

            const container = document.getElementById('trades-container');
            container.innerHTML = '';

            if (!currentSelectedSymbol || globalTradesData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fa-solid fa-folder-open fs-1 text-muted mb-3 d-block"></i>
                        <h6 class="text-muted">No Active Trades Selected or Database Empty</h6>
                    </div>`;
                return;
            }

            const item = globalTradesData.find(i => i.trade_info.symbol === currentSelectedSymbol);
            if (!item) return;

            const t = item.trade_info;
            const pnlClass = item.pnl_usdt >= 0 ? 'pnl-positive' : 'pnl-negative';
            const badgeClass = t.direction === 'LONG' ? 'badge-long' : 'badge-short';

            const cardHtml = `
            <div class="card-custom p-3 p-md-4">
                <!-- Coin Header Bar -->
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-3 border-bottom border-secondary">
                    <div>
                        <span class="fs-3 fw-bold text-white me-2">${t.symbol}</span>
                        <span class="badge ${badgeClass} fs-6">${t.direction} ${t.leverage}x</span>
                    </div>
                    <div class="text-end mt-2 mt-sm-0">
                        <span class="fs-3 fw-bold ${pnlClass}">${item.pnl_usdt >= 0 ? '+' : ''}${item.pnl_usdt} USDT</span>
                        <span class="ms-2 fs-6 text-muted">(${item.pnl_pct}%) PnL</span>
                    </div>
                </div>

                <!-- Big High-Resolution Responsive Chart -->
                <div class="big-chart-container text-center mb-4">
                    <img src="data:image/png;base64,${item.chart}" class="chart-img" alt="Pro Analyst Chart">
                </div>

                <!-- Technical & Position Details (Clean 2x2 Grid Layout) -->
                <h6 class="fw-bold text-white mb-3"><i class="fa-solid fa-sliders me-2 text-info"></i>Position Details & Metrics</h6>
                
                <div class="row g-3">
                    <!-- Top Row 2x2 Grid -->
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-bolt me-1 text-primary"></i> Live Market Price</div>
                            <div class="metric-value mt-1">${item.live_price}</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-right-to-bracket me-1 text-info"></i> Entry Price</div>
                            <div class="metric-value mt-1">${t.entry_price}</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-shield-halved me-1 text-danger"></i> Stop Loss (SL)</div>
                            <div class="metric-value text-danger mt-1">${t.sl_price}</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-bullseye me-1 text-success"></i> Target (TP1)</div>
                            <div class="metric-value text-success mt-1">${t.tp1_price}</div>
                        </div>
                    </div>

                    <!-- Bottom Row 2x2 Grid -->
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-wave-square me-1 text-warning"></i> 4H RSI Indicator</div>
                            <div class="metric-value text-warning mt-1">${item.rsi}</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-chart-area me-1 text-info"></i> 4H ATR Volatility</div>
                            <div class="metric-value text-info mt-1">${item.atr}</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-scale-balanced me-1 text-light"></i> Position Notional Value</div>
                            <div class="metric-value mt-1">$${parseFloat(t.pos_value).toFixed(2)}</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="metric-card-2x2">
                            <div class="metric-title"><i class="fa-solid fa-lock me-1 text-warning"></i> Frozen Margin</div>
                            <div class="metric-value text-warning mt-1">$${parseFloat(t.margin_frozen).toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            </div>`;

            container.innerHTML = cardHtml;
        }

        // Auto load on start & refresh every 30 seconds
        loadDashboard();
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
