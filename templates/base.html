<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Crypto Trading & Analytics Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style>
        :root {
            --bg-main: #080c14;
            --bg-card: #111827;
            --bg-card-hover: #1f293d;
            --border-color: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-warning: #f59e0b;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            letter-spacing: -0.01em;
            min-height: 100vh;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Navbar & Navigation */
        .navbar-custom {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-tabs-custom {
            border-bottom: 1px solid var(--border-color);
            gap: 0.5rem;
        }

        .nav-tabs-custom .nav-link {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            border-radius: 8px 8px 0 0;
            padding: 12px 20px;
            transition: all 0.25s ease;
            background: transparent;
        }

        .nav-tabs-custom .nav-link:hover {
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.05);
        }

        .nav-tabs-custom .nav-link.active {
            color: var(--accent-cyan);
            background: var(--bg-card);
            border-bottom: 3px solid var(--accent-cyan);
            box-shadow: 0 -4px 12px rgba(56, 189, 248, 0.15);
        }

        /* Cards & Containers */
        .card-custom {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .card-custom:hover {
            border-color: #334155;
        }

        /* Badges & Metrics */
        .badge-long {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .badge-short {
            background: rgba(244, 63, 94, 0.12);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .pnl-positive { color: #34d399; font-weight: 700; }
        .pnl-negative { color: #fb7185; font-weight: 700; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom sticky-top px-3 px-lg-4 py-2.5">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-5 text-info" href="/">
                <i class="fa-solid fa-chart-line text-cyan"></i>
                <span class="tracking-wider">PRO TRADER ENGINE</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-dark border border-secondary text-light px-3 py-2 rounded-pill d-flex align-items-center gap-2 shadow-sm">
                    <span class="spinner-grow spinner-grow-sm text-success" role="status" style="width: 8px; height: 8px;"></span>
                    <span class="small fw-semibold">System Live</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-3 px-lg-4 mt-3">
        <ul class="nav nav-tabs nav-tabs-custom">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' or request.path == '/portfolio' %}active{% endif %}" href="/portfolio">
                    <i class="fa-solid fa-wallet me-2"></i>Portfolio Overview
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/active' %}active{% endif %}" href="/active">
                    <i class="fa-solid fa-bolt me-2"></i>Active Trades
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/closed' %}active{% endif %}" href="/closed">
                    <i class="fa-solid fa-clock-rotate-left me-2"></i>Closed Trades
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/sl-analysis' %}active{% endif %}" href="/sl-analysis">
                    <i class="fa-solid fa-triangle-exclamation me-2 text-warning"></i>SL Post-Mortem
                </a>
            </li>
        </ul>
    </div>

    <div class="container-fluid px-3 px-lg-4 py-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
