<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mysql Trading Platform{% endblock %}</title>
    <!-- Tailwind CSS CDN for Modern Professional Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                        ⚡ MYSQL
                    </span>
                </div>
                <div class="hidden md:flex items-center space-x-6">
                    {% if session.get('user_id') %}
                        <a href="/dashboard" class="text-slate-300 hover:text-blue-400 transition font-medium">Dashboard</a>
                        <a href="/profile" class="text-slate-300 hover:text-blue-400 transition font-medium">Profile & NTFY</a>
                        <a href="/logout" class="bg-rose-600/20 text-rose-400 border border-rose-500/30 px-4 py-2 rounded-lg hover:bg-rose-600/30 transition text-sm font-semibold">Logout</a>
                    {% else %}
                        <a href="/login" class="text-slate-300 hover:text-blue-400 transition font-medium">Login</a>
                        <a href="/signup" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-500 transition text-sm font-semibold shadow-lg shadow-blue-600/20">Get Started</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-sm text-slate-500">
        &copy; 2026 MYSQL Trading Platform. All rights reserved.
    </footer>
</body>
</html>
